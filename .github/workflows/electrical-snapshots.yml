# Publish the electrical contract of every robot as JSON, for the electrical web tool
# (Team488/electrical-contract-web). The web tool reads these files on page load, so a
# merged contract change reaches the web with no manual step.
#
# Output: branch `electrical-snapshots`, folder named after the source branch:
#   <branch>/index.json         commit, time, and the list of contracts
#   <branch>/<Contract>.json    one snapshot per ContractToUse name
name: Electrical snapshots

on:
  push:
    branches: [main, ElectricalWeb]
    paths:
      - "src/main/java/competition/electrical_contract/**"
      - "src/main/java/electrical/report/**"
      - "build.gradle"
      - "vendordeps/**"
      - ".github/workflows/electrical-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electrical-snapshots
  cancel-in-progress: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/build/.gradle
  GRADLE_OPTS: "-Xmx3072m"
  CONTRACTS: "Competition 2025 2023 Robox"

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: actions/cache@v4
        with:
          path: build/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'vendordeps/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Export every contract
        shell: bash
        run: |
          mkdir -p out
          for c in $CONTRACTS; do
            ./gradlew electricalReport -q --args="--contract $c --json -f out/$c.json"
          done
          python - <<'PY'
          import json, os
          contracts = os.environ["CONTRACTS"].split()
          index = {
              "gitSha": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "generatedAt": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "contracts": [{"name": c, "file": f"{c}.json"} for c in contracts],
          }
          json.dump(index, open("out/index.json", "w"), indent=2)
          PY

      - name: Publish to the electrical-snapshots branch
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="$RUNNER_TEMP/snapshots"
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" electrical-snapshots >/dev/null; then
            git clone --depth 1 --branch electrical-snapshots "$url" "$dest"
          else
            git init -b electrical-snapshots "$dest"
            git -C "$dest" remote add origin "$url"
            printf '# Electrical snapshots\n\nGenerated by .github/workflows/electrical-snapshots.yml. Do not edit.\n' > "$dest/README.md"
          fi
          rm -rf "$dest/$GITHUB_REF_NAME"
          mkdir -p "$dest/$GITHUB_REF_NAME"
          cp out/*.json "$dest/$GITHUB_REF_NAME/"
          cd "$dest"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Snapshots from $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push origin electrical-snapshots

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
